name: ci-test

# Secrets: this workflow needs NO repository secrets. Every credential below
# (the Postgres user/password, the DB URL) belongs to a throwaway service
# container that only lives for the job. Never echo `secrets.*` or env dumps
# in a step; if a future job (e.g. a deploy) needs a real secret, pass it via
# `env:` from `secrets.*` on that one step only. See readme "CI".

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Read-only token: no job pushes, comments or publishes anything.
permissions:
  contents: read

# A newer push to the same PR supersedes its running checks. Pushes to main are
# never cancelled, so every merged commit gets a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Matches the Makefile's migrateup/migratedown and the CI Postgres service.
  DB_URL: postgresql://root:secret@localhost:5432/golive_cms?sslmode=disable
  MIGRATE_VERSION: v4.16.2

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: golive_cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Install golang-migrate
        run: |
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/${MIGRATE_VERSION}/migrate.linux-amd64.tar.gz | tar xz migrate
          sudo mv migrate /usr/bin/
          which migrate

      - name: create test config file
        run: |
          cat > app.env << EOF
          DB_DRIVER=postgres
          DB_SOURCE=${DB_URL}
          SERVER_ADDRESS=0.0.0.0:8080
          API_PORT=8080
          EOF

      - name: Run migrations
        run: make migrateup

      - name: Test
        env:
          DB_DRIVER: postgres
          DB_SOURCE: ${{ env.DB_URL }}
          SERVER_ADDRESS: 0.0.0.0:8080
          API_PORT: :8080
        run: make coverage-check

  backup-restore:
    name: Backup/restore + migrations up/down/up
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Own compose project (golive_restore_test): migrations up/down/up, backup,
      # wipe, restore, verify, and the API serving the restored media.
      - name: Run restore test
        run: sh scripts/backup/test-restore.sh

  # CD replaces the production .env on every deploy (scripts/deploy/write-env.sh), so a
  # variable compose.yaml reads that CD doesn't write is lost, or stops the stack (#314).
  # Also resolves compose.yaml with a CD-shaped .env of dummy values.
  deploy-env:
    name: CD .env covers compose.yaml
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check compose.yaml against CD's .env writer
        run: sh scripts/deploy/check-env.sh

  go-lint:
    name: Go lint (vet, gofmt, golangci-lint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted (run 'gofmt -w .'):"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      # Runs even when vet/gofmt failed, so one run reports every finding.
      - name: golangci-lint
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@v8
        with:
          # Config: .golangci.yml. Bump deliberately; new versions add findings.
          version: v2.1.6

  sqlc:
    name: sqlc in sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up sqlc
        uses: sqlc-dev/setup-sqlc@v4
        with:
          # Must match the "sqlc vX" header in db/sqlc/*.go.
          sqlc-version: "1.29.0"

      # Fails when db/sqlc differs from what db/query + db/migration generate.
      - name: sqlc diff
        run: sqlc diff

  migrations:
    name: Migrations up/down/up
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: golive_cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      # The `job` context isn't available in job-level env, so export it here.
      - name: Locate the Postgres container
        run: echo "PG_CONTAINER=${{ job.services.postgres.id }}" >> "$GITHUB_ENV"

      - name: Install golang-migrate
        run: |
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/${MIGRATE_VERSION}/migrate.linux-amd64.tar.gz | tar xz migrate
          sudo mv migrate /usr/bin/

      - name: Migrate up
        run: |
          migrate -path db/migration -database "$DB_URL" -verbose up
          # pg_dump from the service container, so client and server versions match.
          docker exec "$PG_CONTAINER" pg_dump -U root --schema-only --no-owner golive_cms > schema-first-up.sql

      - name: Migrate down (all)
        run: |
          migrate -path db/migration -database "$DB_URL" -verbose down -all
          # Every down migration together must remove everything the ups created.
          # pg_class covers tables, views, materialized views, sequences, indexes and
          # composite types (relkind is listed with each leftover).
          leftovers=$(docker exec "$PG_CONTAINER" psql -U root -d golive_cms -tAc "
            SELECT 'relation (' || c.relkind || ') ' || c.relname FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public'
                AND c.relname NOT IN ('schema_migrations', 'schema_migrations_pkey')
            UNION ALL
            SELECT 'type ' || t.typname FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace
              WHERE n.nspname = 'public' AND t.typtype IN ('e', 'd')
            UNION ALL
            SELECT 'function ' || p.proname FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public'
            UNION ALL
            SELECT 'extension ' || extname FROM pg_extension WHERE extname <> 'plpgsql'")
          if [ -n "$leftovers" ]; then
            echo "Objects left behind after migrating all the way down:"
            echo "$leftovers"
            exit 1
          fi

      - name: Migrate up again
        run: |
          migrate -path db/migration -database "$DB_URL" -verbose up
          docker exec "$PG_CONTAINER" pg_dump -U root --schema-only --no-owner golive_cms > schema-second-up.sql
          # The rebuilt schema must be identical to the first one.
          diff -u schema-first-up.sql schema-second-up.sql

  web-tests:
    name: Web tests (editor/collaboration)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # 22 (LTS) — satisfies jsdom@29's engines (>=20.19) without relying on
          # how the "20" alias happens to resolve on the runner.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Run web tests
        working-directory: web
        run: npm test

      # Catches imports that only resolve on case-insensitive filesystems
      # (#259): on this Linux runner a wrong-case import is TS2307. Gates only
      # on module-resolution (TS2307/TS1149/TS1261) and config (TS5xxx/TS6xxx)
      # errors. The "Web type check and build" job's full `astro check` now
      # covers these too (#143), so this is a fast, focused early signal.
      - name: Check web imports resolve (case-sensitive)
        working-directory: web
        run: |
          npx --no-install tsc --noEmit -p . > "$RUNNER_TEMP/tsc.log" 2>&1 || true
          if grep -E "error TS(2307|1149|1261|5[0-9]{3}|6[0-9]{3}):" "$RUNNER_TEMP/tsc.log"; then
            echo "::error::Unresolvable or case-mismatched imports in web/ (see above)"
            exit 1
          fi

  # The collab server's tests on Node 24, the version its image runs (web-tests above
  # runs them on Node 22). process.test.ts spawns the esbuild bundle, so this also
  # checks that Node 24 loads exactly one yjs build (#206).
  collab-server-node24:
    name: Collab server tests (Node 24)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Run collab server tests
        working-directory: web
        run: npx vitest run --project collab-server

  web-check:
    name: Web type check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      # astro check = astro sync + TypeScript over .ts/.tsx/.astro.
      - name: Type check
        working-directory: web
        run: npm run check

      - name: Build
        working-directory: web
        run: npm run build

  docker:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            file: Dockerfile
          - image: web
            context: web
            file: web/Dockerfile
          - image: collab
            context: web
            file: web/collab-server/Dockerfile

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build only: catches Dockerfile breakage. Nothing is pushed anywhere. The collab
      # image is loaded into the local daemon so the smoke step below can run it.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: ${{ matrix.image == 'collab' }}
          tags: golive-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # The collab image on its own Node 24: it starts (the single-yjs-instance probe
      # exits 1 otherwise), prints no "Yjs was already imported" warning, and answers
      # /healthz. The key is a throwaway; no API is needed to start.
      - name: Smoke test the collab image
        if: matrix.image == 'collab'
        run: |
          openssl genpkey -algorithm ed25519 -out smoke.pem
          pubhex=$(openssl pkey -in smoke.pem -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          docker run -d --name collab-smoke \
            -e INTERNAL_API_URL=http://127.0.0.1:9 \
            -e ROLE_LOOKUP_SECRET=smoke -e COLLAB_INTERNAL_SECRET=smoke \
            -e PASETO_V4_PUBLIC_KEY_HEX="$pubhex" \
            golive-collab:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' collab-smoke)
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' collab-smoke)" = true ] || break
            sleep 1
          done
          docker logs collab-smoke > collab-smoke.log 2>&1
          cat collab-smoke.log
          docker exec collab-smoke node --version
          grep -q '"collab_listening"' collab-smoke.log
          grep -q '"yjs_single_instance":true' collab-smoke.log
          if grep -q "Yjs was already imported" collab-smoke.log; then
            echo "::error::the collab image loads yjs twice"
            exit 1
          fi
          [ "$(docker inspect -f '{{.State.Health.Status}}' collab-smoke)" = healthy ]
          docker rm -f collab-smoke
