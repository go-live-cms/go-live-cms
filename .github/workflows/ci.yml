name: ci-test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: golive_cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"
        id: go

      - name: Build
        run: go build -v ./...

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.16.2/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/bin/
          which migrate

      - name: create test config file
        run: |
          cat > app.env << EOF
          DB_DRIVER=postgres
          DB_SOURCE=postgresql://root:secret@localhost:5432/golive_cms?sslmode=disable
          SERVER_ADDRESS=0.0.0.0:8080
          API_PORT=8080
          EOF

      - name: Run migrations
        run: make migrateup

      - name: Test
        env:
          DB_DRIVER: postgres
          DB_SOURCE: postgresql://root:secret@localhost:5432/golive_cms?sslmode=disable
          SERVER_ADDRESS: 0.0.0.0:8080
          API_PORT: :8080
        run: make test

  web-tests:
    name: Web tests (editor/collaboration)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22 (LTS) — satisfies jsdom@29's engines (>=20.19) without relying on
          # how the "20" alias happens to resolve on the runner.
          node-version: "22"

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Run web tests
        working-directory: web
        run: npm test

      - name: Install websocket deps
        working-directory: websocket
        run: npm ci

      - name: Run websocket tests
        working-directory: websocket
        run: npm test
