name: golive_cms_dev

services:
  postgres:
    image: postgres:12-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: golive_cms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d golive_cms"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:${HOST_API_PORT:-8080}:${HOST_API_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./app.env
    environment:
      DB_SOURCE: postgresql://root:secret@postgres:5432/golive_cms?sslmode=disable
      DB_DRIVER: postgres
      MAX_UPLOAD_SIZE: "50MB"
      UPLOAD_PATH: "/app/uploads/media"
      COLLAB_SERVER_URL: "http://websocket:1234"
      COLLAB_SQUASH_SECRET: "dev-squash-secret"
    volumes:
      - .:/app
      - /app/tmp
      - /app/web
      - go_modules:/go/pkg/mod
      - ./uploads:/app/uploads
      - ./web/themes:/app/web/themes:ro
    entrypoint: ["/app/wait-for.sh", "postgres:5432", "--", "/app/start-dev.sh"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
      args:
        PUBLIC_API_URL: http://localhost:${HOST_API_PORT:-8080}/api/v1
        SERVER_API_URL: http://api:${HOST_API_PORT:-8080}/api/v1
    ports:
      - "4321:4321"
    environment:
      PUBLIC_API_URL: http://localhost:${HOST_API_PORT:-8080}/api/v1
      SERVER_API_URL: http://api:${HOST_API_PORT:-8080}/api/v1
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api
  websocket:
    build:
      context: ./websocket
      dockerfile: Dockerfile.dev
    ports:
      - "1234:1234"
    env_file:
      - ./websocket/.env
    environment:
      # Override for Docker reliability
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
      - DATA_PATH=/data/yjs
      - SQUASH_SECRET=dev-squash-secret
    volumes:
      - ./websocket:/app
      - /app/node_modules
      # File-based PEM for reliable Docker env loading
      - ./websocket/public.pem:/run/secrets/public.pem:ro
      - ws_data:/data/yjs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1234/"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      - api

volumes:
  postgres_data:
  go_modules:
  ws_data:
