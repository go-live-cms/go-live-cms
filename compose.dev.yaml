name: golive_cms_dev

services:
  postgres:
    image: postgres:12-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: golive_cms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d golive_cms"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:${HOST_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./app.env
    environment:
      DB_SOURCE: postgresql://root:secret@postgres:5432/golive_cms?sslmode=disable
      DB_DRIVER: postgres
      # Dev only: debug mode seeds admin/123456 + dummy data, allows the local
      # web origins for CORS, and lets COOKIE_SECURE=false send the refresh cookie
      # over plain HTTP. GIN_MODE defaults to release everywhere else.
      GIN_MODE: debug
      COOKIE_SECURE: "false"
      # Container always listens on 8080; HOST_API_PORT only remaps the host side.
      SERVER_ADDRESS: "0.0.0.0:8080"
      API_PORT: ":8080"
      MAX_UPLOAD_SIZE: "50MB"
      UPLOAD_PATH: "/app/uploads/media"
      COLLAB_SERVER_URL: "http://websocket:1234"
      COLLAB_SQUASH_SECRET: "dev-squash-secret"
      # Required: the WS server's per-connection role lookup (#223)
      ROLE_LOOKUP_SECRET: "dev-role-lookup-secret"
      # Server-to-server listener (/internal/*). Deliberately NOT in `ports:`;
      # only the websocket service reaches it over the compose network.
      INTERNAL_SERVER_ADDRESS: "0.0.0.0:8081"
    volumes:
      - .:/app
      - /app/tmp
      - /app/web
      - go_modules:/go/pkg/mod
      - ./uploads:/app/uploads
      - ./web/themes:/app/web/themes:ro
    entrypoint: ["/app/wait-for.sh", "postgres:5432", "--", "/app/start-dev.sh"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
      args:
        PUBLIC_API_URL: http://localhost:${HOST_API_PORT:-8080}/api/v1
        SERVER_API_URL: http://api:8080/api/v1
    ports:
      - "4321:4321"
    environment:
      PUBLIC_API_URL: http://localhost:${HOST_API_PORT:-8080}/api/v1
      SERVER_API_URL: http://api:8080/api/v1
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api
  websocket:
    build:
      context: ./websocket
      dockerfile: Dockerfile.dev
    ports:
      - "1234:1234"
    env_file:
      - ./websocket/.env
    environment:
      # Override for Docker reliability
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
      - DATA_PATH=/data/yjs
      - SQUASH_SECRET=dev-squash-secret
      # Per-connection role check (#216, #223): GET ${INTERNAL_API_URL}/internal/users/:id/role
      # on the API's unpublished internal listener, with ROLE_LOOKUP_SECRET (must match the
      # api service's value). Tickets (#233) are verified and burned in the WS process.
      - INTERNAL_API_URL=http://api:8081
      - ROLE_LOOKUP_SECRET=dev-role-lookup-secret
    volumes:
      - ./websocket:/app
      - /app/node_modules
      # File-based PEM for reliable Docker env loading
      - ./websocket/public.pem:/run/secrets/public.pem:ro
      - ws_data:/data/yjs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1234/"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      - api

volumes:
  postgres_data:
  go_modules:
  ws_data:
