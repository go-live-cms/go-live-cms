name: golive_cms

# Production stack (#272). Only `caddy` publishes ports (80/443): it terminates TLS,
# sends /collab to the Hocuspocus collab service (#206) and everything else to web,
# which forwards /api/v1 and /uploads to the API. Postgres, the API and the collab
# server are reachable only on the compose network.
#
# Secrets come from a `.env` next to this file (never committed). Generate one with
#   go run ./cmd/gen-prod-env -site cms.example.com > .env
# Full guide, first admin account and upgrade notes: docs/operations/deploy.md.
#
# UPGRADING a deployment that used this file before #141: Postgres data and
# uploads now live in the named volumes postgres_data and uploads. They start
# EMPTY, and the API will happily run on an empty database. Move your data
# first: docs/operations/backups.md, "Upgrading a compose.yaml deployment".
# Before #272 the Postgres password was the fixed `secret` and ports 5432/8080/4321
# were published: see docs/operations/deploy.md, "Upgrading from before #272".

services:
  postgres:
    image: postgres:12-alpine
    environment:
      POSTGRES_USER: root
      # Required. Hex (cmd/gen-prod-env), because DB_SOURCE below embeds it in a URL
      # unescaped. Only used when the data volume is first initialised.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: golive_cms
    volumes:
      # Without a named volume the data lives in an anonymous one that a
      # `down -v` or a fresh host silently drops. Back it up: docs/operations/backups.md
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d golive_cms"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    # Built locally (tagged golive/api:local); a deployment pulls the CD image instead
    # (GOLIVE_IMAGE_REGISTRY=ghcr.io/go-live-cms, GOLIVE_IMAGE_TAG=<commit sha>), see
    # scripts/deploy/deploy.sh. Same for web and collab.
    image: "${GOLIVE_IMAGE_REGISTRY:-golive}/api:${GOLIVE_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_SOURCE: "postgresql://root:${POSTGRES_PASSWORD}@postgres:5432/golive_cms?sslmode=disable"
      DB_DRIVER: postgres
      # Explicit so a GIN_MODE=debug in a copied app.env can't enable dev seeding,
      # dev CORS or a non-Secure refresh cookie here. Release always sets Secure,
      # which is why the stack is served over HTTPS by caddy.
      GIN_MODE: release
      # The browser reaches the API same-origin (through caddy and web), so no CORS.
      # Set it only if another origin calls the API with credentials.
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      SERVER_ADDRESS: "0.0.0.0:8080"
      API_PORT: ":8080"
      ACCESS_TOKEN_DURATION: "15m"
      REFRESH_TOKEN_DURATION: "24h"
      # Required: shared with the collab server's access lookup and load/store (#223).
      # Plain interpolation (not :?) so `down`/`ps` still work without it; the API
      # itself refuses to start when it is empty.
      ROLE_LOOKUP_SECRET: "${ROLE_LOOKUP_SECRET}"
      # Required signing/encryption keys (64-hex public, 128-hex private, 64-hex
      # local). The image has no app.env, so they must come from the environment
      # (e.g. a .env file next to this one, never committed).
      PASETO_V4_PUBLIC_KEY_HEX: "${PASETO_V4_PUBLIC_KEY_HEX}"
      PASETO_V4_PRIVATE_KEY_HEX: "${PASETO_V4_PRIVATE_KEY_HEX}"
      PASETO_V4_LOCAL_KEY_HEX: "${PASETO_V4_LOCAL_KEY_HEX}"
      # Optional, only during a key rotation (docs/operations/key-rotation.md).
      PASETO_V4_PREVIOUS_PUBLIC_KEY_HEX: "${PASETO_V4_PREVIOUS_PUBLIC_KEY_HEX:-}"
      PASETO_V4_PREVIOUS_LOCAL_KEY_HEX: "${PASETO_V4_PREVIOUS_LOCAL_KEY_HEX:-}"
      PASETO_PREVIOUS_KEYS_VALID_UNTIL: "${PASETO_PREVIOUS_KEYS_VALID_UNTIL:-}"
      # Server-to-server listener (/internal/*). Never add it to `ports:`.
      INTERNAL_SERVER_ADDRESS: "0.0.0.0:8081"
      # Required (#148): the site is invite-only, so invitations and password
      # resets must be able to go out. The API refuses to start without
      # SMTP_HOST, MAIL_FROM and PUBLIC_BASE_URL (the origin email links point
      # at). TLS is required: implicit on port 465, STARTTLS otherwise
      # (SMTP_TLS=starttls|tls; "none" is only accepted for a loopback relay).
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_TLS: "${SMTP_TLS:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM}"
      # API -> collab server calls (#206/#280): every publish first flushes the doc at
      # collab:1236 and answers 503 if it can't. The secret is the collab service's
      # COLLAB_INTERNAL_SECRET. Required: the API refuses to start without both.
      COLLAB_INTERNAL_URL: "${COLLAB_INTERNAL_URL:-http://collab:1236}"
      COLLAB_INTERNAL_SECRET: "${COLLAB_INTERNAL_SECRET}"
      # Browser requests reach the API as caddy -> web -> api. web appends its peer
      # (caddy) to X-Forwarded-For (web/src/middleware/apiProxy.ts), and caddy sets it
      # to the browser's IP. Trust exactly those two fixed addresses, so rate limits
      # key on the browser. See readme "Rate limiting". SSR requests from web carry no
      # client IP, so exempt web from the general limit (auth limits still apply).
      TRUSTED_PROXIES: "172.28.0.10,172.28.0.11"
      RATE_LIMIT_EXEMPT_CIDRS: "172.28.0.10"
      # Uploaded media. Media rows store absolute paths under it, so keep it the
      # same across deploys and restores. Served at /uploads/media/*.
      UPLOAD_PATH: "/app/uploads/media"
    volumes:
      - uploads:/app/uploads
    entrypoint: ["/app/wait-for.sh", "postgres:5432", "--", "/app/start.sh"]
    command: ["/app/main"]
    # Readiness (/readyz pings Postgres), not liveness (/health); see api/health.go.
    # The runtime image is plain alpine, so this uses busybox wget.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    image: "${GOLIVE_IMAGE_REGISTRY:-golive}/web:${GOLIVE_IMAGE_TAG:-local}"
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      # SSR-side API base on the compose network, read at runtime
      # (gl-admin/lib/server-api-url.ts). Every server-side fetch uses it.
      SERVER_API_URL: http://api:8080/api/v1
      # PUBLIC_API_URL is the browser-facing API URL. Leave it unset: the browser
      # calls /api/v1 and /uploads same-origin. Set it (e.g. https://api.example.com/api/v1)
      # only if media URLs point at another origin; the admin CSP then allows it.
      PUBLIC_API_URL: "${PUBLIC_API_URL:-}"
      # Public origin for canonical/OG URLs, robots.txt and sitemap.xml (#137).
      # Defaults to Caddy's SITE_ADDRESS over https; set it to override (e.g. a
      # SITE_ADDRESS with a scheme or port). Empty would fall back to the
      # request's Host header, with robots/sitemap sent uncacheable.
      SITE_URL: "${SITE_URL:-https://${SITE_ADDRESS:-localhost}}"
    depends_on:
      # Every SSR request calls the API (active theme), so wait for /readyz.
      api:
        condition: service_healthy
    # A static file, served by the Node server without SSR: a page would run the
    # middleware (and an API call) every 10s. API readiness is the api healthcheck's job,
    # and depends_on above already waits for it. busybox wget (node:22-alpine).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4321/favicon.ico"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      default:
        # Fixed so the API can trust exactly this address (TRUSTED_PROXIES above).
        ipv4_address: 172.28.0.10

  # The Hocuspocus collab server (#206, web/collab-server/). Caddy sends /collab here.
  # Live Yjs state is in Postgres (post_ydoc_state), so it has no volume.
  collab:
    image: "${GOLIVE_IMAGE_REGISTRY:-golive}/collab:${GOLIVE_IMAGE_TAG:-local}"
    build:
      context: ./web
      dockerfile: collab-server/Dockerfile
    environment:
      PORT: "1235"
      # Internal listener: /healthz (the image's healthcheck) and the flush the API
      # calls before a publish. Never published; the API reaches it as collab:1236.
      INTERNAL_PORT: "1236"
      # Verifies collab tickets with the API's public key and issuer.
      PASETO_V4_PUBLIC_KEY_HEX: "${PASETO_V4_PUBLIC_KEY_HEX}"
      PASETO_ISSUER: golive.auth
      # Access lookups and load/store on the API's unpublished internal listener.
      # Required: the server exits at startup without any of these.
      INTERNAL_API_URL: http://api:8081
      ROLE_LOOKUP_SECRET: "${ROLE_LOOKUP_SECRET}"
      COLLAB_INTERNAL_SECRET: "${COLLAB_INTERNAL_SECRET}"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # Exactly ONE collab process: live docs and the ticket replay guard are in
    # memory (web/collab-server/CLAUDE.md). Never scale this service.
    deploy:
      replicas: 1

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Your domain (automatic HTTPS) or localhost (Caddy's local CA, for testing).
      SITE_ADDRESS: "${SITE_ADDRESS:-localhost}"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account. Keep it: re-issuing on every deploy hits
      # Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      collab:
        condition: service_healthy
    restart: unless-stopped
    networks:
      default:
        # Fixed so the API can trust it (TRUSTED_PROXIES above).
        ipv4_address: 172.28.0.11

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          # Dynamic addresses come from the upper half only, so no other container can
          # take the fixed .10 (web) / .11 (caddy) that the API trusts.
          ip_range: 172.28.0.128/25

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
