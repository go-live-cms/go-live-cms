name: golive_cms

# UPGRADING a deployment that used this file before #141: Postgres data and
# uploads now live in the named volumes postgres_data and uploads. They start
# EMPTY, and the API will happily run on an empty database. Move your data
# first: docs/operations/backups.md, "Upgrading a compose.yaml deployment".

services:
  postgres:
    image: postgres:12-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: golive_cms
    ports:
      - "5432:5432"
    volumes:
      # Without a named volume the data lives in an anonymous one that a
      # `down -v` or a fresh host silently drops. Back it up: docs/operations/backups.md
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d golive_cms"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_SOURCE: postgresql://root:secret@postgres:5432/golive_cms?sslmode=disable
      DB_DRIVER: postgres
      # Explicit so a GIN_MODE=debug in a copied app.env can't enable dev seeding,
      # dev CORS or a non-Secure refresh cookie here. Release always sets Secure
      # (browsers accept Secure cookies on http://localhost; use HTTPS elsewhere).
      GIN_MODE: release
      # The web app (and admin SPA) is served from :4321, a different origin than
      # the API, so release mode needs it allowed explicitly. Set your real domain.
      CORS_ALLOWED_ORIGINS: "http://localhost:4321"
      SERVER_ADDRESS: "0.0.0.0:8080"
      API_PORT: ":8080"
      ACCESS_TOKEN_DURATION: "15m"
      REFRESH_TOKEN_DURATION: "24h"
      # Required: shared with the collab WebSocket server's role lookup (#223).
      # Plain interpolation (not :?) so `down`/`ps` still work without it; the API
      # itself refuses to start when it is empty.
      ROLE_LOOKUP_SECRET: "${ROLE_LOOKUP_SECRET}"
      # Required signing/encryption keys (64-hex public, 128-hex private, 64-hex
      # local). The image has no app.env, so they must come from the environment
      # (e.g. a .env file next to this one, never committed).
      PASETO_V4_PUBLIC_KEY_HEX: "${PASETO_V4_PUBLIC_KEY_HEX}"
      PASETO_V4_PRIVATE_KEY_HEX: "${PASETO_V4_PRIVATE_KEY_HEX}"
      PASETO_V4_LOCAL_KEY_HEX: "${PASETO_V4_LOCAL_KEY_HEX}"
      # Server-to-server listener (/internal/*). Never add it to `ports:`.
      INTERNAL_SERVER_ADDRESS: "0.0.0.0:8081"
      # The web container forwards the admin's /api/v1 and /uploads calls here and
      # appends the browser IP to X-Forwarded-For (web/src/middleware/apiProxy.ts).
      # Trust only its fixed address so rate limits key on the browser; add your
      # reverse proxy's address if one sits in front of the API. See readme
      # "Rate limiting". SSR requests from web carry no client IP, so exempt them
      # from the general limit (auth limits still apply).
      TRUSTED_PROXIES: "172.28.0.10"
      RATE_LIMIT_EXEMPT_CIDRS: "172.28.0.10"
      # Uploaded media. Media rows store absolute paths under it, so keep it the
      # same across deploys and restores. Served at /uploads/media/*.
      UPLOAD_PATH: "/app/uploads/media"
    volumes:
      - uploads:/app/uploads
    entrypoint: ["/app/wait-for.sh", "postgres:5432", "--", "/app/start.sh"]
    command: ["/app/main"]
    # Readiness (/readyz pings Postgres), not liveness (/health); see api/health.go.
    # The runtime image is plain alpine, so this uses busybox wget.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "4321:4321"
    environment:
      PUBLIC_API_URL: http://api:8080/api/v1
      # SSR-side API base (gl-admin/lib/server-api-url.ts).
      SERVER_API_URL: http://api:8080/api/v1
    depends_on:
      # Every SSR request calls the API (active theme), so wait for /readyz.
      api:
        condition: service_healthy
    networks:
      default:
        # Fixed so the API can trust exactly this address (TRUSTED_PROXIES above).
        ipv4_address: 172.28.0.10

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_data:
  uploads:
