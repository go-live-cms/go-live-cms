<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Your {{.SiteTitle}} email address was changed</title></head>
<body style="margin:0;padding:24px;background:#f4f5f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px;">
    <h1 style="margin:0 0 16px;font-size:20px;">Your email address was changed</h1>
    <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">The email address of your {{.SiteTitle}} account <strong>{{.Username}}</strong> was changed to <strong>{{.NewEmail}}</strong>. Emails about the account, password reset links included, now go there.</p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#59636e;">If you didn't do this, ask a site admin to restore your email address and reset your password.</p>
  </div>
</body>
</html>
