<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Review requested: {{.PostTitle}}</title></head>
<body style="margin:0;padding:24px;background:#f4f5f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px;">
    <h1 style="margin:0 0 16px;font-size:20px;">{{.ActorName}} asked for a review</h1>
    <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">{{.ActorName}} asked {{if .Assigned}}you{{else}}an editor{{end}} to review <strong>{{.PostTitle}}</strong> on {{.SiteTitle}}.</p>
    {{if .Note}}<p style="margin:0 0 16px;padding:12px 14px;border-radius:8px;background:#f4f5f6;font-size:14px;line-height:1.5;white-space:pre-wrap;">{{.Note}}</p>{{end}}
    <p style="margin:0 0 24px;"><a href="{{.Link}}" style="display:inline-block;padding:12px 20px;border-radius:8px;background:#1f2328;color:#ffffff;text-decoration:none;font-weight:600;">Open the post</a></p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#59636e;">Publishing the post, requesting changes or dismissing the request resolves it.</p>
  </div>
</body>
</html>
