<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Changes requested: {{.PostTitle}}</title></head>
<body style="margin:0;padding:24px;background:#f4f5f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px;">
    <h1 style="margin:0 0 16px;font-size:20px;">Changes requested</h1>
    <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">{{.Reviewer}} reviewed <strong>{{.PostTitle}}</strong> on {{.SiteTitle}} and asked for changes:</p>
    <p style="margin:0 0 24px;padding:12px 14px;border-radius:8px;background:#f4f5f6;font-size:14px;line-height:1.5;white-space:pre-wrap;">{{.Message}}</p>
    <p style="margin:0 0 24px;"><a href="{{.Link}}" style="display:inline-block;padding:12px 20px;border-radius:8px;background:#1f2328;color:#ffffff;text-decoration:none;font-weight:600;">Open the post</a></p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#59636e;">Make the changes, then request another review.</p>
  </div>
</body>
</html>
