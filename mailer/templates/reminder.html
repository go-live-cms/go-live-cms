<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Reminder: {{.PostTitle}}</title></head>
<body style="margin:0;padding:24px;background:#f4f5f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px;">
    <h1 style="margin:0 0 16px;font-size:20px;">Reminder: {{.PostTitle}}</h1>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.5;">You asked to be reminded on <strong>{{.When}}</strong> about <strong>{{.PostTitle}}</strong> on {{.SiteTitle}}.</p>
    <p style="margin:0 0 24px;"><a href="{{.Link}}" style="display:inline-block;padding:12px 20px;border-radius:8px;background:#1f2328;color:#ffffff;text-decoration:none;font-weight:600;">Open the post</a></p>
    <p style="margin:0 0 8px;font-size:13px;line-height:1.5;color:#59636e;">Or paste this link into your browser:<br><a href="{{.Link}}" style="color:#59636e;word-break:break-all;">{{.Link}}</a></p>
    <p style="margin:16px 0 0;font-size:13px;line-height:1.5;color:#59636e;">You set this reminder with a date in the post. Remove the date, or its reminder, to stop reminders like this one.</p>
  </div>
</body>
</html>
